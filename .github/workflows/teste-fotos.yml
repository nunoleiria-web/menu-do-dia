name: Teste de fotos (temporário)
on:
  push:
    branches: [teste-fotos]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: scripts
      - run: cp probe/fotos.mjs scripts/fotos-teste.mjs && cd scripts && node fotos-teste.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OUT_DIR: ../probe/fotos
          LIB: recipes.json
      - name: Gravar
        if: always()
        run: |
          git config user.name "teste-bot"; git config user.email "noreply@users.noreply.github.com"
          git add -f probe/fotos && git commit -q -m "Fotos de teste [skip ci]" && git push -q origin HEAD:teste-fotos || echo nada
