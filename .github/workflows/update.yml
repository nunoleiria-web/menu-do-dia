name: Atualizar menu
on:
  schedule: [{ cron: "0 6 */2 * *" }]   # de 2 em 2 dias, 06:00 UTC
  workflow_dispatch:                     # também podes correr à mão
    inputs:
      redo_photos:
        description: "Voltar a escolher TODAS as fotos (corrige fotos erradas)"
        type: boolean
        default: false
      photos_only:
        description: "Só procurar fotos em falta (não mexe em preços nem receitas)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Instala só o que o script precisa (a sharp), isolado do projeto do site
      - run: npm install --no-audit --no-fund
        working-directory: scripts
      - run: node scripts/update.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REDO_PHOTOS: ${{ inputs.redo_photos && '1' || '' }}
          PHOTOS_ONLY: ${{ inputs.photos_only && '1' || '' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - if: ${{ !cancelled() }}   # grava o que tiver mudado, mesmo que o passo anterior tenha falhado
        run: |
          git config user.name "menu-bot"; git config user.email "menu-bot@users.noreply.github.com"
          git add api/data public/meals
          git diff --cached --quiet || (git commit -m "Atualização automática $(date -u +%F)" && git push)
