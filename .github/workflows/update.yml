name: Atualizar menu
on:
  schedule:
    # Todos os dias às 05:00 de Lisboa. O cron é em UTC e a hora de Lisboa muda (verão/inverno),
    # por isso corre às 04:00 e às 05:00 UTC e o primeiro passo só deixa continuar quando em Lisboa são as 5h.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:                     # também podes correr à mão
    inputs:
      redo_photos:
        description: "Voltar a escolher TODAS as fotos (corrige fotos erradas)"
        type: boolean
        default: false
      reread:
        description: "Voltar a ler os folhetos em vigor (mais produtos e preços)"
        type: boolean
        default: false
      photos_only:
        description: "Só procurar fotos em falta (não mexe em preços nem receitas)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: |
          H=$(TZ=Europe/Lisbon date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" != "05" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "Em Lisboa são as ${H}h: não é a hora, a saltar."; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Instala só o que o script precisa (a sharp), isolado do projeto do site
      - if: steps.gate.outputs.run == 'true'
        run: npm install --no-audit --no-fund
        working-directory: scripts
      - if: steps.gate.outputs.run == 'true'
        run: node scripts/update.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          AI_DELAY_MS: ${{ vars.AI_DELAY_MS }}
          REDO_PHOTOS: ${{ inputs.redo_photos && '1' || '' }}
          PHOTOS_ONLY: ${{ inputs.photos_only && '1' || '' }}
          REREAD: ${{ inputs.reread && '1' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_IMAGE_MODEL: ${{ vars.CLOUDFLARE_IMAGE_MODEL }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }}
          MAX_RESTYLE: ${{ vars.MAX_RESTYLE }}
      - if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}   # grava o que tiver mudado, mesmo que o passo anterior tenha falhado
        run: |
          git config user.name "menu-bot"; git config user.email "menu-bot@users.noreply.github.com"
          git add api/data public/meals
          echo "Alterações a gravar:"; git status --short | head -30
          git diff --cached --quiet || (git commit -m "Atualização automática $(date -u +%F)" && git push)
