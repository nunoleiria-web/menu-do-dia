name: Sondagem de fontes oficiais (teste)
# Só corre quando se faz push para o ramo sondagem-fontes. Só lê páginas públicas; não publica nada.
on:
  push:
    branches: [sondagem-fontes]
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node probe/probe.mjs
      - run: cat probe/out/REPORT.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - name: Gravar resultados no ramo de teste
        if: always()
        run: |
          git config user.name "sondagem-bot"; git config user.email "noreply@users.noreply.github.com"
          git add -f probe/out
          git commit -q -m "Resultados da sondagem [skip ci]" && git push -q origin HEAD:sondagem-fontes || echo "nada a gravar"
